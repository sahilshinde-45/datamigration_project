version: "3"
services:
  db:
    image: quay.io/debezium/example-postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - my-network1
    external_links:
      - pocv2-kafka1-1
      - pocv2-kafka2-1
      - pocv2-kafka3-1

volumes:
  pgdata:

networks:
  my-network1:
    external: true
